[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nezubot-discrod"
version = "1.10.3"
description = "Discord AI assistant with disposable offline Docker tools"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.4,<3", "openai>=1.60,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
rag = ["fastembed>=0.9.1,<0.10", "numpy>=2.5.5,<2.6"]

[project.scripts]
nezubot-discrod = "nezubot_discrod.bot:main"

[tool.setuptools.packages.find]
include = ["nezubot_discrod*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker and the built sandbox image"]
